async function renderSettlementDetail(main){
  const rec = await getJSON("settlement:"+closingSelectedConvoy, null);
  if(!rec){ main.innerHTML = `<div class="card">${msgHtml("error","تعذر إيجاد بيانات التسوية")}</div>`; return; }

  main.innerHTML = `
    <button class="back-link" id="backList">→ كل القوافل</button>
    <div class="card">
      <h2>${escapeHtml(rec.convoyName)}</h2>
      <p class="sub" style="margin:0;">📍 ${escapeHtml(rec.convoyLocation||"—")}</p>
    </div>
    <div id="stagesBox"></div>
    <div class="card">
      <h2>📎 مرفقات PDF</h2>
      ${isAdmin() ? `<div class="upload-box"><input type="file" id="fileInput" accept="application/pdf,image/*"></div><div id="uploadMsg"></div>` : ""}
      <div id="filesList"></div>
    </div>
    <button class="btn btn-accent" id="printSettlementBtn">🖨️ طباعة / حفظ PDF لكل التسويات</button>
  `;
  document.getElementById("backList").addEventListener("click", ()=>{ closingPage="list"; render(); });
  document.getElementById("printSettlementBtn").addEventListener("click", ()=>window.print());

  renderStages();
  renderFilesList();
  const fi = document.getElementById("fileInput");
  if(fi) fi.addEventListener("change", onUpload);

  function renderStages(){
    const box = document.getElementById("stagesBox");
    box.innerHTML = `<div id="printArea">` + Object.entries(SETTLEMENT_STAGES).map(([key,def])=>{
      const st = rec.stages[key];
      const overdue = isOverdue(st.dueAt) && st.docs.some(d=>!d.received);
      return `
      <div class="card">
        <div class="top-row" style="display:flex;justify-content:space-between;align-items:center;">
          <h2 style="margin:0;">${def.label}</h2>
          ${overdue ? `<span class="badge badge-danger">متأخر ⏰</span>` : (st.docs.every(d=>d.received) ? `<span class="badge badge-success">كاملة ✓</span>` : `<span class="badge badge-muted">جارية</span>`)}
        </div>
        <p class="sub" style="margin:6px 0 0;">يبدأ حساب المدة من: ${def.triggerLabel} — المهلة ${def.dueDays} أيام عمل</p>
        <div class="info-grid" style="margin-top:8px;">
          <div class="info-item"><div class="k">تاريخ البداية</div><div class="v">${st.triggerAt?formatDate(st.triggerAt):"—"}</div></div>
          <div class="info-item"><div class="k">آخر موعد للتسليم</div><div class="v">${st.dueAt?formatDate(st.dueAt):"لم يُحدَّد بعد"}</div></div>
        </div>
        ${(isAdmin() && !st.triggerAt) ? `
          <div class="field">
            <label>حدّد تاريخ "${def.triggerLabel}" يدويًا (لو النظام مسجلوش تلقائي)</label>
            <input type="date" class="manualTriggerInput" data-stage="${key}">
          </div>
          <button class="btn btn-outline btn-sm setTriggerBtn" data-stage="${key}">حفظ التاريخ</button>
        ` : ""}
        <div class="divider"></div>
        <div id="docsBox_${key}"></div>
      </div>`;
    }).join("") + `</div>`;

    Object.keys(SETTLEMENT_STAGES).forEach(key=>renderDocs(key));

    box.querySelectorAll(".setTriggerBtn").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        const key = e.target.dataset.stage;
        const val = box.querySelector(`.manualTriggerInput[data-stage="${key}"]`).value;
        if(!val) return;
        const iso = new Date(val).toISOString();
        rec.stages[key].triggerAt = iso;
        rec.stages[key].dueAt = addWorkDays(iso, SETTLEMENT_STAGES[key].dueDays);
        await setJSON("settlement:"+closingSelectedConvoy, rec);
        renderStages();
      });
    });
  }

  function renderDocs(key){
    const box = document.getElementById(`docsBox_${key}`);
    if(!box) return;
    const st = rec.stages[key];
    box.innerHTML = st.docs.map(d=>`
      <div class="cl-item ${d.received?"done":""}">
        <div class="top-row">
          <div class="lbl">${escapeHtml(d.label)}</div>
          ${d.received ? `<span class="badge badge-success">استلمتها إدارة الحالة</span>` : `<span class="badge badge-muted">لم تُستلَم بعد</span>`}
        </div>
        ${d.received ? `<div class="meta">في ${formatDateTime(d.receivedAt)}</div>` : ""}
        ${!isAdmin() ? `<button class="btn ${d.received?"btn-outline":"btn-primary"} btn-sm ackDocBtn" data-stage="${key}" data-doc="${d.id}" style="margin-top:8px;">${d.received?"إلغاء الاستلام":"تأكيد الاستلام"}</button>` : ""}
      </div>
    `).join("");
    if(!isAdmin()){
      box.querySelectorAll(".ackDocBtn").forEach(btn=>{
        btn.addEventListener("click", async (e)=>{
          const doc = rec.stages[e.target.dataset.stage].docs.find(x=>x.id===e.target.dataset.doc);
          doc.received = !doc.received;
          doc.receivedAt = doc.received ? new Date().toISOString() : null;
          await setJSON("settlement:"+closingSelectedConvoy, rec);
          renderDocs(e.target.dataset.stage);
        });
      });
    }
  }

  function renderFilesList(){
    const box = document.getElementById("filesList");
    if(!rec.attachments || rec.attachments.length===0){ box.innerHTML = `<p class="sub" style="margin:0;">لا يوجد ملفات مرفوعة</p>`; return; }
    box.innerHTML = rec.attachments.map(a=>`
      <div class="file-row">
        <div><div class="nm">📄 ${escapeHtml(a.name)}</div><div class="sz">${(a.size/1024).toFixed(0)} كيلوبايت · ${formatDateTime(a.uploadedAt)}</div></div>
        <button class="btn btn-outline btn-sm downloadBtn" data-id="${a.id}" style="width:auto;">تحميل</button>
      </div>
    `).join("");
    box.querySelectorAll(".downloadBtn").forEach(btn=>btn.addEventListener("click", ()=>downloadAttachment(btn.dataset.id)));
  }

  const FILE_CHUNK_SIZE = 30000, MAX_FILE_MB = 4;
  async function onUpload(e){
    const file = e.target.files[0];
    if(!file) return;
    const msgBox = document.getElementById("uploadMsg");
    if(file.size > MAX_FILE_MB*1024*1024){
      msgBox.innerHTML = msgHtml("error", `الملف أكبر من ${MAX_FILE_MB} ميجا`);
      e.target.value = ""; return;
    }
    msgBox.innerHTML = msgHtml("info","جاري الرفع...");
    const b64 = await fileToBase64(file);
    const parts = [];
    for(let i=0;i<b64.length;i+=FILE_CHUNK_SIZE) parts.push(b64.slice(i, i+FILE_CHUNK_SIZE));
    const id = uid();
    for(let i=0;i<parts.length;i++){
      await httpStorage.set(`file:${id}:${i}`, parts[i]);
      msgBox.innerHTML = msgHtml("info", `جاري الرفع... (${i+1}/${parts.length})`);
    }
    const meta = { id, name:file.name, mime:file.type, size:file.size, parts:parts.length, uploadedAt:new Date().toISOString() };
    rec.attachments.push(meta);
    await setJSON("settlement:"+closingSelectedConvoy, rec);
    msgBox.innerHTML = msgHtml("success","تم رفع الملف ✓");
    renderFilesList();
    e.target.value = "";
  }
  async function downloadAttachment(id){
    const meta = rec.attachments.find(a=>a.id===id);
    if(!meta) return;
    let b64 = "";
    for(let i=0;i<meta.parts;i++){
      const r = await httpStorage.get(`file:${id}:${i}`);
      if(r && r.value) b64 += r.value;
    }
    const link = document.createElement("a");
    link.href = `data:${meta.mime||"application/octet-stream"};base64,${b64}`;
    link.download = meta.name;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
}
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{ resolve(reader.result.substring(reader.result.indexOf(",")+1)); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function renderAdminTasks(main){

        }).join("")}
      </div>
    </div>

  `;
  document.getElementById("deptTabs").addEventListener("click",(e)=>{
    const b = e.target.closest("button[data-d]"); if(!b) return;
    adminSelectedDept = b.dataset.d;
    render();
  });
  renderBoard(true);

  function renderBoard(adminView){
    const box = document.getElementById("deptTaskBoard");
    box.innerHTML = PHASES.map(ph=>`
      <div class="card">
        <h2 style="font-size:15px;">${ph.l}</h2>
        <div id="phaseBox_${ph.id}"></div>
        ${adminView ? `
          <div class="row2" style="margin-top:10px;align-items:flex-end;">
            <div class="field" style="margin-bottom:0;">
              <input type="text" class="newTaskInput" data-phase="${ph.id}" placeholder="نص المهمة">
            </div>
            <button class="btn btn-ghost btn-sm addTaskBtn" data-phase="${ph.id}">+ إضافة</button>
          </div>
        ` : ""}
      </div>
    `).join("");
    PHASES.forEach(ph=>renderPhaseTasks(ph.id, adminView));
    if(adminView){
      box.querySelectorAll(".addTaskBtn").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const phase = btn.dataset.phase;
          const input = box.querySelector(`.newTaskInput[data-phase="${phase}"]`);
          const label = input.value.trim();
          if(!label) return;
          deptTasksCache.push({ id:uid(), dept:adminSelectedDept, phase, label, done:false, doneAt:null, doneBy:"", createdAt:new Date().toISOString() });
          await saveDeptTasks();
          input.value = "";
          renderPhaseTasks(phase, adminView);
        });
      });
    }
  }

  function renderPhaseTasks(phase, adminView){
    const box = document.getElementById(`phaseBox_${phase}`);
    if(!box) return;
    const list = deptTasksCache.filter(t=>t.dept===adminSelectedDept && t.phase===phase);
    if(list.length===0){ box.innerHTML = `<p class="hint">لا توجد مهام مضافة</p>`; return; }
    box.innerHTML = list.map(t=>`
      <div class="point-row">
        <div class="pl">
          <span>${escapeHtml(t.label)}</span>
          ${t.done ? `<span class="dept-tag">✔️ تم في ${formatDateTime(t.doneAt)}</span>` : `<span class="dept-tag">لم يتم بعد</span>`}
        </div>
        ${adminView ? `<button class="btn btn-danger-outline btn-sm delTaskBtn" data-id="${t.id}" style="width:auto;">حذف</button>` : ""}
      </div>
    `).join("");
    if(adminView){
      box.querySelectorAll(".delTaskBtn").forEach(btn=>{
        btn.addEventListener("click", async (e)=>{
          deptTasksCache = deptTasksCache.filter(x=>x.id!==e.target.dataset.id);
          await saveDeptTasks();
          renderPhaseTasks(phase, adminView);
        });
      });
    }
  }
}

/* ======================================================================

const PREP_SUPPLIES_KEY = "prep:supplies";
const PREP_VILLAGE_KEY = "prep:village";
const PREP_HISTORY_KEY = "prepHistory";
let prepPage = "supplies"; // supplies | village | history
let prepSupplies = [];
let prepVillage = [];

const DEFAULT_VILLAGE_ITEMS = [
  "دفاتر التسجيل","دفاتر النظارات","إيصال الأدوية","كشوفات التوسيع","كشوفات الأرشيف",
  "لافتات الغرف","فيست متطوع","فيست ليدر","كاب","بالطو دكتور","مراية معمل النظارات",
  "شنط الصيدلية","رول أب معمل النظارات","رول أب عام","بانر عيادة الكشف","بانر المدخل",
  "أعلام 3م","أعلام مكتب","أقلام","دباسات","دبابيس","حبارات","دوسيهات فارغة","الأدوية",
  "مياه","عصير","مشروبات","تكييفات","آيس بوكس","كروت الحالات",
];

async function loadPrepChecklists(){
  prepSupplies = await getJSON(PREP_SUPPLIES_KEY, []);
  if(!Array.isArray(prepSupplies)) prepSupplies = [];
  prepVillage = await getJSON(PREP_VILLAGE_KEY, null);
  if(!Array.isArray(prepVillage) || prepVillage===null){
    prepVillage = DEFAULT_VILLAGE_ITEMS.map(l=>({id:uid(), label:l, qty:"", done:false}));
    await setJSON(PREP_VILLAGE_KEY, prepVillage);
  }
}
async function savePrepSupplies(){ return await setJSON(PREP_SUPPLIES_KEY, prepSupplies); }
async function savePrepVillage(){ return await setJSON(PREP_VILLAGE_KEY, prepVillage); }

function renderPrepList(main, kind){
  const isVillage = kind==="village";
  const list = isVillage ? prepVillage : prepSupplies;
  const saveFn = isVillage ? savePrepVillage : savePrepSupplies;
  const title = isVillage ? "تجهيزات القرية" : "المستلزمات التي تُؤخذ مع القافلة";

  main.innerHTML = `
    <div class="card">
      <h2>${title}</h2>
      <div class="row2" style="align-items:flex-end;">
        <div class="field" style="margin-bottom:0;">
          <label>إضافة بند جديد</label>
          <input type="text" id="newItemInput" placeholder="اسم البند">
        </div>
        <button class="btn btn-accent" id="addItemBtn" style="height:44px;">إضافة</button>
      </div>
    </div>
    <div class="card">
      <div id="itemsTable"></div>
      <div class="divider"></div>
      <button class="btn btn-danger-outline" id="archivePrepBtn">أرشفة هذه القائمة وبدء تجهيز جديد فارغ</button>
    </div>
  `;
  renderTable();

  document.getElementById("addItemBtn").addEventListener("click", async ()=>{
    const input = document.getElementById("newItemInput");
    const label = input.value.trim();
    if(!label) return;
    list.push({ id:uid(), label, qty:"", done:false });
    await saveFn();
    input.value = "";
    renderTable();
  });

  document.getElementById("archivePrepBtn").addEventListener("click", async ()=>{
    if(!confirm("هل أنت متأكد من أرشفة هذه القائمة وبدء قائمة جديدة فارغة؟")) return;
    const hist = await getJSON(PREP_HISTORY_KEY, []);
    hist.push({ id:uid(), kind, title, items:list, archivedAt:new Date().toISOString() });
    await setJSON(PREP_HISTORY_KEY, hist);
    if(isVillage){ prepVillage = DEFAULT_VILLAGE_ITEMS.map(l=>({id:uid(), label:l, qty:"", done:false})); await savePrepVillage(); }
    else{ prepSupplies = []; await savePrepSupplies(); }
    render();
  });

  function renderTable(){
    const box = document.getElementById("itemsTable");
    if(list.length===0){ box.innerHTML = `<p class="sub" style="margin:0;">لا توجد بنود بعد — أضِف من الأعلى</p>`; return; }
    box.innerHTML = `
      <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:14px;">
        <thead>
          <tr style="border-bottom:2px solid var(--border);text-align:right;">
            <th style="padding:8px 6px;">البند</th>
            <th style="padding:8px 6px;width:90px;">العدد</th>
            <th style="padding:8px 6px;width:60px;">تم</th>
            <th style="padding:8px 6px;width:40px;"></th>
          </tr>
        </thead>
        <tbody>
          ${list.map((it,i)=>`
            <tr style="border-bottom:1px solid var(--border);${it.done?'background:var(--success-bg);':''}">
              <td style="padding:7px 6px;">${escapeHtml(it.label)}</td>
              <td style="padding:7px 6px;"><input type="text" class="qtyInput" data-i="${i}" value="${escapeHtml(it.qty||"")}" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);"></td>
              <td style="padding:7px 6px;text-align:center;"><input type="checkbox" class="doneChk" data-i="${i}" ${it.done?"checked":""} style="width:19px;height:19px;accent-color:var(--primary);"></td>
              <td style="padding:7px 6px;"><button class="btn btn-danger-outline btn-sm delItemBtn" data-i="${i}" style="width:auto;padding:6px 9px;">✕</button></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
      </div>
    `;
    box.querySelectorAll(".qtyInput").forEach(inp=>{
      inp.addEventListener("change",(e)=>{ list[e.target.dataset.i].qty = e.target.value; saveFn(); });
    });
    box.querySelectorAll(".doneChk").forEach(chk=>{
      chk.addEventListener("change",(e)=>{ list[e.target.dataset.i].done = e.target.checked; saveFn(); renderTable(); });
    });
    box.querySelectorAll(".delItemBtn").forEach(btn=>{
      btn.addEventListener("click",(e)=>{
        list.splice(parseInt(e.target.dataset.i),1);
        saveFn();
        renderTable();
      });
    });
  }
}

function renderPrepHistory(main){
  main.innerHTML = `<div class="card"><p class="sub" style="margin:0;">جاري التحميل...</p></div>`;

function downloadGuideDocx(){
  const link = document.createElement("a");
  const bin = atob(GUIDE_DOCX_B64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  link.href = URL.createObjectURL(new Blob([arr], { type:"application/pdf" }));
  link.download = GUIDE_DOCX_NAME;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

      <div class="explain-step"><div class="n">2</div><div class="t"><b>الانتظار الأول:</b> بعد التسجيل تنتظر الحالة في منطقة الانتظار الأولى حتى يحين دورها في الفحص المبدئي.</div></div>
      <div class="explain-step"><div class="n">3</div><div class="t"><b>الفحص المبدئي:</b> فريق أخصائيين في عربية شفاء المجهزة بأجهزة الأوتوريف، تمهيدًا للعرض على لجنة الأطباء.</div></div>
      <div class="explain-step"><div class="n">4</div><div class="t"><b>الانتظار الثاني وجلسات التوعية:</b> تنتظر الحالة في منطقة الانتظار الثانية قبل الكشف، وتُعقد فيها ثلاث جلسات توعية للأهالي في الساعة الحادية عشرة صباحًا والواحدة ظهرًا والثالثة عصرًا.</div></div>
      <div class="explain-step"><div class="n">5</div><div class="t"><b>الكشف:</b> 3 أطباء رمد يشخّصون الحالة ويحددون احتياجها.</div></div>
      <div class="explain-step"><div class="n">6</div><div class="t"><b>التوسيع ومقياس النظر:</b> الحالة التي تحتاج توسيع الحدقة تأخذ القطرة وتنتظر ثم تعود لإعادة الكشف. والحالة التي تحتاج نظارة تتوجه إلى مقياس النظر وتستلم ورقتين بمقاسات النظارة (أصل وصورة).</div></div>
      <div class="explain-step"><div class="n">7</div><div class="t"><b>الأرشيف:</b> بعد الكشف والتوسيع ومقياس النظر تسلّم الحالة أوراقها في الأرشيف، فيسجل متطوع الأرشيف احتياجها على نظام شفاء بالكود (عملية ونوعها والعين، نظارة، أو أدوية بعدد العلب وعدد مرات الاستخدام في اليوم)، وتصلها رسالة بنتيجة الكشف. ثم يوجّهها الأرشيف حسب احتياجها:</div></div>
      <div class="explain-step"><div class="n">8</div><div class="t"><b>الأدوية:</b> يوقّع الأرشيف الحالة على إيصال استلام الدواء ويسلّمها الإيصال، فتتوجه به إلى الصيدلية وتسلّمه وتستلم الدواء.</div></div>
      <div class="explain-step"><div class="n">9</div><div class="t"><b>النظارات:</b> يدبّس الأرشيف صورة ورقة المقاسات في استمارة الحالة ويسلّمها الورقة الأصل، فتتوجه بها إلى معمل النظارات لاختيار الشنبر.</div></div>
      <div class="explain-step"><div class="n">10</div><div class="t"><b>القياسات الحيوية لحالات العمليات:</b> يوقّع الأرشيف الحالة أو يأخذ بصمتها على ورقة إجراء فحص السكر والضغط ويسلّمها الورقة، فتتوجه بها إلى نقطة القياسات الحيوية لقياس الضغط والسكر، تمهيدًا لتحويلها إلى المستشفى.</div></div>
      <p><b>المخرج:</b> تشخيص واضح لكل حالة، وصرف الأدوية والنظارات لمستحقيها، وتسجيل حالات العمليات في الأرشيف مع قياس الضغط والسكر لها.</p>
    </div>

    <div class="card explain-block">
      <h3>المرحلة السادسة — ما بعد القافلة: حصر حالات العمليات والتنسيق مع المستشفى <span class="badge badge-muted">⏱ 5 أيام عمل</span></h3>
      <div class="explain-step"><div class="n">1</div><div class="t">استكشاف الحالات المسجلة بالأرشيف وحصر المستحقين فعليًا لإجراء عملية.</div></div>
      <div class="explain-step"><div class="n">2</div><div class="t">تحديد موعد لكل حالة مع المستشفى المتعاقد معه.</div></div>
      <div class="explain-step"><div class="n">3</div><div class="t">بعد إجراء العملية: تسليم الأدوية اللازمة بإيصال استلام رسمي.</div></div>
      <div class="explain-step"><div class="n">4</div><div class="t">توقيع الحالة (أو ولي أمرها) على: إقرار الموافقة على العملية، إقرار إجراء العملية فعليًا، وإقرار استلام التعليمات الطبية.</div></div>
      <p><b>المخرج:</b> عمليات مُجراة موثّقة بإقرارات وإيصالات استلام رسمية.</p>
    </div>

    <div class="card explain-block">
      <h3>المرحلة السابعة — متابعة ما بعد العمليات <span class="badge badge-muted">⏱ حتى شهر من إجراء العملية</span></h3>
      <div class="explain-step"><div class="n">1</div><div class="t"><b>المتابعة التليفونية</b> (خلال 7 أيام من العملية): يقوم بها متطوعون مسؤولون بالقطاع، للاطمئنان المبدئي على الحالة الصحية والتأكد من عدم وجود مضاعفات طارئة وانتظام أخذ الأدوية، مع اتصال من مدير المشروع في منتصف المدة للاطمئنان.</div></div>
      <div class="explain-step"><div class="n">2</div><div class="t"><b>المتابعة الميدانية</b> (بعد 7 أيام): نزول للقرية لإعادة الكشف بصحبة المستشفى المتعاقد معه، وتحويل أي حالة تستدعي تدخلاً إضافيًا للمستشفى مرة أخرى إذا لزم الأمر.</div></div>
      <div class="explain-step"><div class="n">3</div><div class="t"><b>المتابعة الميدانية الثانية</b> (بعد أسبوعين): نزول ثانٍ لفريق المتابعين، برفقة طبيب استشاري رمد مستقل عن المستشفى، لتقييم الحالة الصحية والوقوف على أي مضاعفات.</div></div>
      <div class="explain-step"><div class="n">4</div><div class="t"><b>المتابعة الميدانية الأخيرة وإخلاء الطرف</b> (بعد شهر): نزول أخير من فريق المتابعين للاطمئنان على الحالات، وتوقيعها على إخلاء طرف في حال عدم وجود شكاوى أخرى.</div></div>
      <p><b>المخرج:</b> اطمئنان موثّق على سلامة كل الحالات التي خضعت للعمليات، وإغلاق آمن لدورة رعاية كل حالة من بداية الاستكشاف وحتى تمام الشفاء.</p>
    </div>

   - المتطوعين: كل متطوع بيدخل باسم مستخدم وكلمة مرور، ويشوف بس الصفحات

   - الرسائل: رسالة تسجيل + رسالة نتيجة الكشف لكل حالة على رقمها.
   - التقارير: كشوف وتقارير جاهزة للطباعة / PDF — للقافلة الحالية وللقوافل السابقة.
   - نقل البيانات القديمة من جوجل شيت لمرة واحدة.

const VOL_SESSION_KEY = "shifa_vol_session";
const VOLUNTEERS_KEY = "volunteers";
const VOL_PAGE_LABELS = { register:"📋 التسجيل", archive:"🗂️ الأرشيف", pharmacy:"💊 الصيدلية", glasses:"👓 النظارات" };

function getVolSession(){ try{ const r = localStorage.getItem(VOL_SESSION_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function setVolSession(o){ try{ localStorage.setItem(VOL_SESSION_KEY, JSON.stringify(o)); }catch(e){} }
function clearVolSession(){ try{ localStorage.removeItem(VOL_SESSION_KEY); }catch(e){} }
function isVolunteer(){ return !!getVolSession(); }
function volPages(){ const s = getVolSession(); return (s && s.vol && Array.isArray(s.vol.pages)) ? s.vol.pages : []; }
function actorName(){
  const v = getVolSession();
  if(v && v.vol) return v.vol.name + " (متطوع)";
  const s = getSession();
  return s ? deptLabel(s.role) : "";
}
async function loadVolunteers(){ const l = await getJSON(VOLUNTEERS_KEY, []); return Array.isArray(l) ? l : []; }
async function saveVolunteers(list){ return await setJSON(VOLUNTEERS_KEY, list); }
function newRev(){ return Math.random().toString(36).slice(2,10); }

/* أرقام عربي -> إنجليزي، وتنضيف رقم الموبايل */
function toLatinDigits(s){ return String(s||"").replace(/[٠-٩]/g, d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)); }
function cleanPhone(s){ return toLatinDigits(s).replace(/\D/g,""); }
function isValidEgMobile(p){ return /^01[0125]\d{8}$/.test(p); }
function intlPhone(p){ p = cleanPhone(p); return p.startsWith("0") ? "2" + p : p; }
function byCode(a,b){ return String(a.code||"").localeCompare(String(b.code||""), "en", { numeric:true }); }

/* ---------------- بوابة الدخول الأولى للنظام ---------------- */
function renderEntryGate(main){
  if(!getAppsScriptUrl()){
    main.innerHTML = `
      <div class="gate-wrap"><div class="card gate-card">
        <div class="ic">🔗</div>
        <h2>الجهاز ده مش مربوط بالنظام</h2>
        <p class="sub">لو إنت متطوع: افتح <b>لينك المتطوعين</b> اللي بعتهولك مدير النظام.</p>
        <button class="btn btn-outline btn-sm" id="toSetup">أنا مدير النظام — ربط الجهاز</button>
      </div></div>`;
    document.getElementById("toSetup").addEventListener("click", ()=>renderSetupRequired(main));
    return;
  }
  main.innerHTML = `
    <div class="gate-wrap">
      <div class="card gate-card">
        <div class="ic">🤝</div>
        <h2>دخول المتطوعين</h2>
        <p class="sub">ادخل باسم المستخدم وكلمة المرور اللي أخدتهم من مدير النظام</p>
        <div class="field" style="text-align:right;">
          <label>اسم المستخدم</label>
          <input type="text" id="volUser" autocomplete="username" dir="ltr" style="text-align:left;">
        </div>
        <div class="field" style="text-align:right;">
          <label>كلمة المرور</label>
          <input type="password" id="volPass" autocomplete="current-password" dir="ltr" style="text-align:left;">
        </div>
        <div id="volLoginMsg"></div>
        <button class="btn btn-primary" id="volLoginBtn">دخول</button>
        <div class="divider"></div>
        <button class="btn btn-ghost btn-sm" id="staffLoginBtn">🏢 دخول فريق المؤسسة / مدير النظام</button>
      </div>
    </div>`;
  const doLogin = async ()=>{
    const u = document.getElementById("volUser").value.trim().toLowerCase();
    const p = document.getElementById("volPass").value;
    const box = document.getElementById("volLoginMsg");
    if(!u || !p){ box.innerHTML = msgHtml("error","اكتب اسم المستخدم وكلمة المرور"); return; }
    const btn = document.getElementById("volLoginBtn");
    btn.disabled = true; btn.textContent = "جاري الدخول...";
    let list;
    try{ list = await loadVolunteersStrict(); }
    catch(e){ btn.disabled = false; btn.textContent = "دخول"; box.innerHTML = msgHtml("error","تعذّر الاتصال — اتأكد من الإنترنت"); return; }
    btn.disabled = false; btn.textContent = "دخول";
    const v = list.find(x=>String(x.username).toLowerCase()===u);
    if(!v || String(v.password)!==p){ box.innerHTML = msgHtml("error","اسم المستخدم أو كلمة المرور غير صحيحة"); return; }
    if(!v.active){ box.innerHTML = msgHtml("error","حسابك موقوف حالياً — راجع مدير النظام"); return; }
    if(!v.pages || !v.pages.length){ box.innerHTML = msgHtml("error","لم يتم منحك صلاحية على أي صفحة بعد — راجع مدير النظام"); return; }
    setVolSession({ vol:{ id:v.id, name:v.name, username:v.username, pages:v.pages }, rev:v.rev, at:new Date().toISOString() });
    await loadCurrentConvoy();
    convoyPage = v.pages[0];
    currentSection = "convoy";
    render();

    renderLoginGate(main, DEPTS.map(d=>d.id), ()=>{ currentSection="hub"; render(); }, "دخول فريق المؤسسة");
    const back = document.createElement("button");
    back.className = "back-link"; back.textContent = "→ رجوع لدخول المتطوعين";
    back.addEventListener("click", ()=>render());
    main.prepend(back);
  });
}
/* نفس loadVolunteers بس بترمي خطأ لو مفيش نت (عشان منقولش "باسورد غلط" والمشكلة في النت) */
async function loadVolunteersStrict(){
  const r = await httpStorage.get(VOLUNTEERS_KEY);
  if(!r || !r.value) return [];
  try{ const l = JSON.parse(r.value); return Array.isArray(l) ? l : []; }catch(e){ return []; }
}

/* ---------------- واجهة المتطوع (صفحات القافلة المسموحة فقط) ---------------- */
function renderVolunteerShell(main){
  const pages = volPages();
  if(!pages.length){ clearVolSession(); render(); return; }
  if(convoyPage!=="guide" && !pages.includes(convoyPage)) convoyPage = pages[0];
  currentSection = "convoy";
  renderConvoySection(main);
}
async function verifyVolunteerSession(){
  const s = getVolSession();
  if(!s) return;
  let list;
  try{ list = await loadVolunteersStrict(); }catch(e){ return; } // مفيش نت — نسيبه يكمّل
  const v = list.find(x=>x.id===s.vol.id);
  if(!v || !v.active || v.rev!==s.rev || !v.pages || !v.pages.length){ clearVolSession(); return; }
  s.vol = { id:v.id, name:v.name, username:v.username, pages:v.pages };
  setVolSession(s);
}

/* ---------------- الرسائل للحالات ---------------- */
const SMS_TPL_KEY = "smsTemplates";
const DEFAULT_SMS_TEMPLATES = {
  reg:    "أهلاً {الاسم}، تم تسجيلك في قافلة شفاء الطبية بـ{المكان}. كود الكشف الخاص بك: {الكود}. مؤسسة غيث",
  action: "أهلاً {الاسم}، تم الكشف عليك في قافلة شفاء الطبية. نتيجة الكشف: {الإجراء}. سيتم التواصل معك على هذا الرقم لتحديد المواعيد. مؤسسة غيث",
  none:   "أهلاً {الاسم}، تم الكشف عليك في قافلة شفاء الطبية ولا تحتاج حالياً لأي إجراء إضافي. نتمنى لك دوام الصحة. مؤسسة غيث"
};
function caseActionText(c){
  const n = c.needs || {}, parts = [];
  if(n.surgery && n.surgery.needed){
    let t = "تحتاج إلى عملية " + (n.surgery.type||"");
    if(n.surgery.eye) t += " (" + (n.surgery.eye==="العينين" ? "العينين" : "العين ال" + (n.surgery.eye==="يمين"?"يمنى":"يسرى")) + ")";
    parts.push(t.replace(/\s+/g," ").trim());
  }
  if(n.glasses) parts.push("تحتاج إلى نظارة طبية");
  if(n.medications && n.medications.length) parts.push("صرف أدوية: " + n.medications.map(m=>m.type + (m.perDay ? " " + dosePhrase(m.perDay) : "")).join("، "));
  return parts.join("، و");
}
function dosePhrase(n){
  n = parseInt(n)||0; if(!n) return "";
  if(n===1) return "مرة واحدة في اليوم";
  if(n===2) return "مرتين في اليوم";
  return n + (n<=10 ? " مرات" : " مرة") + " في اليوم";
}
function medLine(m){ return m.type + " ×" + (m.boxes||1) + (m.perDay ? " — " + dosePhrase(m.perDay) : ""); }
function caseResultKind(c){ return caseActionText(c) ? "action" : "none"; }
function buildCaseMessage(c, kind, tpls){
  const tpl = (tpls && tpls[kind]) || DEFAULT_SMS_TEMPLATES[kind] || "";
  return tpl.replace(/\{الاسم\}/g, (c.name||"").split(" ")[0])
            .replace(/\{الاسم_كامل\}/g, c.name||"")
            .replace(/\{الكود\}/g, c.code||"")
            .replace(/\{المكان\}/g, (currentConvoy && currentConvoy.location)||"")
            .replace(/\{الإجراء\}/g, caseActionText(c));
}
function isMsgPending(st){ return !st; }
async function loadMsgStatusMap(){
  const r = await httpStorage.listValues("msg:");
  const map = {};
  (r.items||[]).forEach(it=>{ try{ map[it.key.slice(4)] = JSON.parse(it.value); }catch(e){} });
  return map;
}
async function markMsg(code, kind, text){
  const cur = await getJSON("msg:"+code, {}) || {};
  cur[kind] = text;
  return await setJSON("msg:"+code, cur);
}

let msgFilter = "reg";
async function renderMessages(cm){
  if(currentRole()!=="admin"){ cm.innerHTML = `<div class="card">${msgHtml("error","الصفحة دي لمدير النظام بس")}</div>`; return; }
  cm.innerHTML = `<div class="card"><p class="sub" style="margin:0;">جاري تحميل الحالات والرسائل...</p></div>`;
  let tpls, cases, statusMap;
  try{
    const [t, cs, st] = await Promise.all([ getJSON(SMS_TPL_KEY, null), fetchAllCases(), loadMsgStatusMap() ]);
    tpls = Object.assign({}, DEFAULT_SMS_TEMPLATES, t||{}); cases = cs; statusMap = st;
  }catch(e){
    if(cm.isConnected) cm.innerHTML = `<div class="card">${msgHtml("error","تعذّر الاتصال بقاعدة البيانات")}</div>`;
    return;
  }
  if(!cm.isConnected) return;   // المستخدم راح لصفحة تانية أثناء التحميل
  cases.sort((a,b)=> String(a.registeredAt||"").localeCompare(String(b.registeredAt||"")));

  const items = [];
  cases.forEach(c=>{
    const st = statusMap[c.code] || {};
    if(msgFilter==="reg" || msgFilter==="all") items.push({ c, kind:"reg", status: st.reg||"" });
    if((msgFilter==="res" || msgFilter==="all") && c.archived) items.push({ c, kind:"res", status: st.res||"" });
  });
  const shown = msgFilter==="all" ? items : items.filter(it=>isMsgPending(it.status));
  const pendingReg = cases.filter(c=>isMsgPending((statusMap[c.code]||{}).reg)).length;
  const pendingRes = cases.filter(c=>c.archived && isMsgPending((statusMap[c.code]||{}).res)).length;

  cm.innerHTML = `
    <div class="card">
      <h2>📩 رسائل الحالات</h2>
      <p class="sub">كل حالة بيوصلها رسالتين على رقمها: <b>رسالة تسجيل</b> لما تتسجل، و<b>رسالة نتيجة</b> بعد الأرشيف (فيها العملية أو النظارة أو الأدوية — أو إنها مش محتاجة إجراء). الإرسال بضغطة من موبايلك على واتساب أو SMS.</p>
    </div>

    <div class="card">
      <div class="sub-nav" style="margin:0 0 12px;">
        <button data-mf="reg" class="${msgFilter==="reg"?"active":""}">رسائل التسجيل (${pendingReg} معلّقة)</button>
        <button data-mf="res" class="${msgFilter==="res"?"active":""}">رسائل النتيجة (${pendingRes} معلّقة)</button>
        <button data-mf="all" class="${msgFilter==="all"?"active":""}">الكل</button>
      </div>
      ${shown.length && msgFilter!=="all" ? `<button class="btn btn-primary" id="waNextBtn" style="margin-bottom:12px;">▶ ابعت التالية على واتساب (${shown.length} متبقية)</button>` : ""}
      <div id="msgListBox">
      ${shown.length===0 ? `<p class="sub" style="margin:0;">${msgFilter==="all"?"لا توجد حالات بعد":"✓ مفيش رسائل معلّقة هنا"}</p>` :
        shown.map((it,i)=>{
          const txt = buildCaseMessage(it.c, it.kind==="reg" ? "reg" : caseResultKind(it.c), tpls);
          const ph = cleanPhone(it.c.phone);
          const okPhone = isValidEgMobile(ph);
          return `

/* ======================================================================
   🖨️ التقارير — كشوف جاهزة للطباعة / PDF
   ====================================================================== */
const REPORT_TYPES = [
  { id:"summary",   ic:"📊", label:"ملخص القافلة",            desc:"الأعداد والاحتياجات وإنتاجية المتطوعين" },
  { id:"all",       ic:"📋", label:"كشف كل الحالات",          desc:"كل المسجلين واحتياج كل حالة",            landscape:true },
  { id:"ops",       ic:"🏥", label:"كشف حالات العمليات",       desc:"للمستشفى — الاسم والرقم القومي والتليفون ونوع التدخل", landscape:true },
  { id:"glasses",   ic:"👓", label:"كشف استلام النظارات",      desc:"بخانة توقيع للمستلم (للتسويات)",          landscape:true },
  { id:"meds",      ic:"💊", label:"كشف صرف الأدوية",          desc:"الأدوية لكل حالة بخانة توقيع (للتسويات)",  landscape:true },
  { id:"pending",   ic:"⏳", label:"حالات لم تُكشف بعد",        desc:"اتسجلت ولسه متأرشفتش" },
  { id:"messages",  ic:"📩", label:"متابعة الرسائل",           desc:"مين وصلته رسالة التسجيل والنتيجة" },
];
let reportState = { source:"current", type:"summary" };

/* بيانات قافلة: الحالية من الحالات الشغالة، أو سابقة من النسخة المحفوظة عند الإنهاء */
async function loadReportData(source){
  if(source==="current"){
    const [cases, msgs] = await Promise.all([ fetchAllCases(), loadMsgStatusMap() ]);
    return { cases, msgs, location: currentConvoy ? currentConvoy.location : "", name:"القافلة الحالية", date: currentConvoy ? currentConvoy.startedAt : null };
  }
  const [rec, cases, msgs] = await Promise.all([ getJSON("convoy:"+source, null), getJSON("convoyCases:"+source, null), getJSON("convoyMsgs:"+source, {}) ]);
  return { cases: Array.isArray(cases) ? cases : null, msgs: msgs||{}, location: rec ? rec.location : "", name: rec ? rec.name : "", date: rec ? (rec.startedAt||rec.endedAt) : null, stats: rec ? rec.stats : null };
}

function rptTable(headers, rows, opts){
  opts = opts || {};
  return `
    <table class="rpt-table">
      <thead><tr>${headers.map(h=>`<th${h.w?` style="width:${h.w}"`:""}>${escapeHtml(h.t||h)}</th>`).join("")}</tr></thead>
      <tbody>${rows.length ? rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${headers.length}" style="text-align:center;padding:14px;">لا توجد حالات</td></tr>`}</tbody>
    </table>`;
}
function needsSummary(c){
  const n = c.needs || {}, p = [];
  if(n.surgery && n.surgery.needed) p.push("عملية " + (n.surgery.type||"") + (n.surgery.eye ? " — " + n.surgery.eye : ""));
  if(n.glasses) p.push("نظارة");
  if(n.medications && n.medications.length) p.push("أدوية");
  return c.archived ? (p.join(" + ") || "لا يحتاج إجراء") : "لم يُكشف بعد";
}
const e_ = s => escapeHtml(s==null?"":s);
const blank = `<span class="rpt-blank"></span>`;

function buildReportBody(type, d){
  const cases = (d.cases||[]).slice().sort(byCode);
  const n = i => i+1;
  if(type==="summary"){
    const s = aggregateReport(cases);
    const archived = cases.filter(c=>c.archived).length;
    const glassesDelivered = cases.filter(c=>c.needs && c.needs.glasses && c.glassesInfo && c.glassesInfo.delivered).length;
    const vols = {};
    cases.forEach(c=>{
      if(c.registeredBy){ vols[c.registeredBy] = vols[c.registeredBy] || {reg:0,arc:0}; vols[c.registeredBy].reg++; }
      if(c.archivedBy){ vols[c.archivedBy] = vols[c.archivedBy] || {reg:0,arc:0}; vols[c.archivedBy].arc++; }
    });
    const box = (num, l)=>`<div class="rpt-stat"><div class="n">${num}</div><div class="l">${l}</div></div>`;
    return `
      <div class="rpt-stats">
        ${box(s.total,"إجمالي المسجلين")}${box(archived,"تم الكشف عليهم")}${box(s.total-archived,"لم يُكشف بعد")}
        ${box(s.surgeryCount,"يحتاجون عملية")}${box(s.glassesCount,"يحتاجون نظارة")}${box(s.medsNeededCases,"يحتاجون أدوية")}
        ${box(s.medsDispensedCases,"استلموا أدوية")}${box(glassesDelivered,"استلموا نظارة")}
      </div>
      <h3 class="rpt-h">العمليات حسب نوع التدخل</h3>
      ${rptTable(["نوع التدخل","عدد الحالات"], Object.entries(s.surgeryByType).map(([t,c])=>[e_(t), c]))}
      <h3 class="rpt-h">الأدوية</h3>
      ${rptTable(["الدواء","المطلوب (علبة)","المصروف (علبة)"], Array.from(new Set([...Object.keys(s.medsNeededByType),...Object.keys(s.medsDispensedByType)])).map(t=>[e_(t), s.medsNeededByType[t]||0, s.medsDispensedByType[t]||0]))}
      <h3 class="rpt-h">إنتاجية المتطوعين والإدارات</h3>
      ${rptTable(["الاسم","حالات سجّلها","حالات أرشفها"], Object.entries(vols).sort((a,b)=>(b[1].reg+b[1].arc)-(a[1].reg+a[1].arc)).map(([k,v])=>[e_(k), v.reg, v.arc]))}
    `;
  }
  if(type==="all"){
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","السن","الرقم القومي","الهاتف","الاحتياج","سجّلها"],
      cases.map((c,i)=>[n(i), e_(c.code), e_(c.name), e_(c.age), `<span dir="ltr">${e_(c.nationalId)}</span>`, `<span dir="ltr">${e_(c.phone)}</span>`, e_(needsSummary(c)), e_((c.registeredBy||"").replace(" (متطوع)",""))]));
  }
  if(type==="ops"){
    const list = cases.filter(c=>c.needs && c.needs.surgery && c.needs.surgery.needed);
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","السن","الرقم القومي","الهاتف","هاتف آخر","نوع التدخل","العين",{t:"ملاحظات",w:"130px"}],
      list.map((c,i)=>[n(i), e_(c.code), e_(c.name), e_(c.age), `<span dir="ltr">${e_(c.nationalId)}</span>`, `<span dir="ltr">${e_(c.phone)}</span>`, `<span dir="ltr">${e_(c.phone2)}</span>`, e_(c.needs.surgery.type), e_(c.needs.surgery.eye), blank]));
  }
  if(type==="glasses"){
    const list = cases.filter(c=>c.needs && c.needs.glasses);
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","الرقم القومي","الهاتف","تم التسليم",{t:"توقيع المستلم",w:"150px"}],
      list.map((c,i)=>[n(i), e_(c.code), e_(c.name), `<span dir="ltr">${e_(c.nationalId)}</span>`, `<span dir="ltr">${e_(c.phone)}</span>`, (c.glassesInfo && c.glassesInfo.delivered) ? "✓" : "", blank]));
  }
  if(type==="meds"){
    const list = cases.filter(c=>c.needs && c.needs.medications && c.needs.medications.length);
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","الرقم القومي","الأدوية","تم الصرف",{t:"توقيع المستلم",w:"150px"}],
      list.map((c,i)=>[n(i), e_(c.code), e_(c.name), `<span dir="ltr">${e_(c.nationalId)}</span>`, c.needs.medications.map(m=>e_(medLine(m))).join("<br>"), (c.pharmacy && c.pharmacy.dispensed) ? "✓" : "", blank]));
  }
  if(type==="pending"){
    const list = cases.filter(c=>!c.archived);
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","السن","الهاتف","وقت التسجيل"],
      list.map((c,i)=>[n(i), e_(c.code), e_(c.name), e_(c.age), `<span dir="ltr">${e_(c.phone)}</span>`, e_(formatDateTime(c.registeredAt))]));
  }
  if(type==="messages"){
    const m = d.msgs || {};
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","الهاتف","رسالة التسجيل","رسالة النتيجة"],
      cases.map((c,i)=>{ const s = m[c.code]||{}; return [n(i), e_(c.code), e_(c.name), `<span dir="ltr">${e_(c.phone)}</span>`, e_(s.reg||"لم تُرسل"), c.archived ? e_(s.res||"لم تُرسل") : "—"]; }));
  }
  return "";
}

        ${REPORT_TYPES.map(t=>`<button class="rpt-type ${t.id===reportState.type?"active":""}" data-rt="${t.id}"><span class="ic">${t.ic}</span><b>${t.label}</b><small>${t.desc}</small></button>`).join("")}
      </div>`}
    </div>
    <div id="rptOut"></div>
  `;
  if(!sources.length) return;
  if(!sources.some(s=>s.id===reportState.source)) reportState.source = sources[0].id;

  const out = document.getElementById("rptOut");

/* ---------------- تصدير Excel ---------------- */
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((res, rej)=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ()=>res(); s.onerror = ()=>rej(new Error("تعذّر تحميل مكتبة Excel — اتأكد من الإنترنت"));
    document.head.appendChild(s);
  });
}
async function exportCasesExcel(btn, cases, statusMap, location){
  const old = btn.textContent; btn.disabled = true; btn.textContent = "جاري التجهيز...";
  try{
    await loadSheetJS();
    statusMap = statusMap || {};
    const yn = b => b ? "نعم" : "لا";
    const rows = (cases||[]).slice().sort(byCode).map(c=>{
      const n = c.needs || {}, s = n.surgery || {}, st = statusMap[c.code] || {};
      return {
        "الكود": c.code, "الاسم": c.name||"", "الرقم القومي": c.nationalId||"", "السن": c.age||"",
        "رقم الهاتف": c.phone||"", "رقم هاتف آخر": c.phone2||"",
        "وقت التسجيل": formatDateTime(c.registeredAt), "سجّلها": c.registeredBy||"",
        "تمت الأرشفة": yn(c.archived), "أرشفها": c.archivedBy||"",
        "يحتاج عملية": yn(s.needed), "نوع التدخل": s.type||"", "العين": s.eye||"",
        "يحتاج نظارة": yn(n.glasses),
        "الأدوية": (n.medications||[]).map(medLine).join("، "),
        "صُرفت الأدوية": yn(c.pharmacy && c.pharmacy.dispensed),
        "استُلمت النظارة": yn(c.glassesInfo && c.glassesInfo.delivered),
        "رسالة التسجيل": st.reg||"", "رسالة النتيجة": st.res||""
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = Object.keys(rows[0]||{"":""}).map(k=>({ wch: Math.max(10, k.length+4) }));
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views:[{ RTL:true }] };
    XLSX.utils.book_append_sheet(wb, ws, "الحالات");
    const out = XLSX.write(wb, { bookType:"xlsx", type:"array" });
    const url = URL.createObjectURL(new Blob([out], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const a = document.createElement("a");
    a.href = url; a.download = `Shifa-cases-${new Date().toISOString().slice(0,10)}.xlsx`;   // اسم إنجليزي: بعض المتصفحات بتبوّظ الأسماء العربي
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ alert(e.message); }
  btn.disabled = false; btn.textContent = old;
}

const OLD_SHEET_URL_KEY = "shifa_apps_script_url";   // الرابط القديم اللي كان محفوظ على الجهاز ده
async function oldSheetCall(url, payload){
  const res = await fetch(url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  if(j && j.error) throw new Error(j.error);
  return j;
}
function renderMigrationBlock(){
  let oldUrl = ""; try{ oldUrl = localStorage.getItem(OLD_SHEET_URL_KEY) || ""; }catch(e){}
  return `
    <div class="card">
      <h2>📦 نقل البيانات القديمة من جوجل شيت</h2>
      <p class="sub">بينسخ كل بيانات النظام القديمة (العمليات، المتابعات، القوافل السابقة، التسويات، الإعدادات وكلمات المرور) من جوجل شيت لقاعدة البيانات الجديدة. اعملها مرة واحدة بس. جوجل شيت نفسه مش بيتمسح منه حاجة.</p>
      <div class="field"><label>رابط Apps Script القديم</label>
        <input type="text" id="mig_url" value="${escapeHtml(oldUrl)}" placeholder="https://script.google.com/macros/s/..." dir="ltr" style="text-align:left;"></div>
      <label class="checkline"><input type="checkbox" id="mig_overwrite"><span>استبدل أي بيانات موجودة بنفس الاسم في القاعدة الجديدة</span></label>
      <div id="migMsg"></div>
      <button class="btn btn-primary" id="migBtn">بدء النقل</button>
    </div>`;
}
function wireMigrationBlock(){
  const btn = document.getElementById("migBtn");
  if(!btn) return;
  btn.addEventListener("click", async ()=>{
    const url = document.getElementById("mig_url").value.trim();
    const overwrite = document.getElementById("mig_overwrite").checked;
    const box = document.getElementById("migMsg");
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ box.innerHTML = msgHtml("error","حط رابط Apps Script القديم صح"); return; }
    btn.disabled = true;
    try{
      box.innerHTML = msgHtml("info","جاري قراءة قائمة البيانات من جوجل شيت...");
      const r = await oldSheetCall(url, { action:"list", prefix:"" });
      const keys = (r && r.keys) || [];
      const existing = overwrite ? new Set() : new Set((await httpStorage.list("")).keys || []);
      const todo = keys.filter(k=>!existing.has(k));
      let done = 0, failed = [];
      const worker = async ()=>{
        while(todo.length){
          const k = todo.shift();
          try{
            const v = await oldSheetCall(url, { action:"get", key:k });
            if(v && v.value!==undefined && v.value!==null) await httpStorage.set(k, String(v.value));
          }catch(e){ failed.push(k); }
          done++;
          box.innerHTML = msgHtml("info", `جاري النقل... ${done} من ${done + todo.length}`);
        }
      };
      await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
      const skipped = keys.length - done;
      box.innerHTML = failed.length
        ? msgHtml("error", `اتنقل ${done - failed.length} عنصر، وفشل ${failed.length} — دوس "بدء النقل" تاني يكمّل الناقص.`)
        : msgHtml("success", `✓ تم نقل ${done} عنصر${skipped ? ` (و${skipped} كانوا موجودين أصلاً)` : ""}. افتح الصفحة من جديد عشان تشوف البيانات.`);
    }catch(e){
      box.innerHTML = msgHtml("error","تعذّر الوصول لجوجل شيت القديم: " + e.message);
    }
    btn.disabled = false;
  });
}

/* ======================================================================
   🗑️ مسح قافلة — لمدير النظام بس
   - قافلة سابقة: بيمسح تقريرها وكشوفها ورسائلها وملف تسوياتها (والمرفقات)،
     واختياري حالات العمليات والمتابعات اللي اتنقلت منها.
   - القافلة الحالية: بيلغيها من غير ما يحفظ أي حاجة (مثلاً قافلة تجربة).
   ====================================================================== */
async function convoyLinkedCounts(id){
  const [ops, fus] = await Promise.all([ httpStorage.listValues("op:"), httpStorage.listValues("followup:") ]);
  const pick = r => (r.items||[]).filter(it=>{ try{ return JSON.parse(it.value).sourceConvoyId===id; }catch(e){ return false; } }).map(it=>it.key);
  return { opKeys: pick(ops), fuKeys: pick(fus) };
}
async function deleteEndedConvoy(id, withLinked){
  // 1) من سجل القوافل
  const idx = await loadConvoyIndex();
  await saveConvoyIndex(idx.filter(c=>c.id!==id));
  // 2) ملف التسويات + مرفقاته
  const st = await getJSON("settlement:"+id, null);
  if(st && Array.isArray(st.attachments)){
    for(const a of st.attachments){
      for(let i=0;i<(a.parts||0);i++){ try{ await httpStorage.delete(`file:${a.id}:${i}`); }catch(e){} }
    }
  }
  try{
    const sidx = await getJSON(SETTLEMENT_INDEX_KEY, []);
    await setJSON(SETTLEMENT_INDEX_KEY, (sidx||[]).filter(x=>x.convoyId!==id));
  }catch(e){}
  // 3) بيانات القافلة نفسها
  await Promise.all(["convoy:","convoyCases:","convoyMsgs:","settlement:"].map(p=>httpStorage.delete(p+id).catch(()=>null)));
  // 4) اختياري: العمليات والمتابعات اللي جاية منها
  if(withLinked){
    const { opKeys, fuKeys } = await convoyLinkedCounts(id);
    await Promise.all([...opKeys, ...fuKeys].map(k=>httpStorage.delete(k).catch(()=>null)));
  }
  return true;
}
async function cancelCurrentConvoy(){
  for(const p of ["case:","archived:","dispensed:","glassesDelivered:","msg:"]) await deleteAllWithPrefix(p);
  try{ await httpStorage.delete(CURRENT_CONVOY_KEY); }catch(e){}
  medStock = [];
  await saveMedStock();
  currentConvoy = null;
  return true;
}

/* كارت المسح — بيطلب باسورد مدير النظام قبل أي مسح */

      <p class="sub">${isCur

        : "بيمسح تقرير القافلة وكشوفها ورسائلها وملف تسوياتها ومرفقاته. <b>مفيش رجوع بعد المسح.</b>"}</p>
      ${extra||""}
      <div class="field"><label>للتأكيد اكتب باسورد مدير النظام</label>
        <input type="password" id="delConvoyPass" dir="ltr" style="text-align:left;"></div>
      <div id="delConvoyMsg"></div>
      <button class="btn btn-danger-outline" id="delConvoyBtn">${isCur ? "إلغاء القافلة ومسح بياناتها" : "مسح القافلة نهائيًا"}</button>
    </div>`;
}
function wireDeleteConvoy(onConfirm){
  const btn = document.getElementById("delConvoyBtn");
  if(!btn) return;
  btn.addEventListener("click", async ()=>{
    const box = document.getElementById("delConvoyMsg");
    const pass = document.getElementById("delConvoyPass").value;
    await loadDeptPasswords();
    if(!pass || pass !== (deptPasswords && deptPasswords.admin)){ box.innerHTML = msgHtml("error","باسورد مدير النظام غير صحيح"); return; }
    if(!confirm("متأكد؟ المسح ده مالوش رجوع.")) return;
    btn.disabled = true; btn.textContent = "جاري المسح...";
    try{ await onConfirm(); }
    catch(e){ btn.disabled = false; btn.textContent = "حاول تاني"; box.innerHTML = msgHtml("error","حصلت مشكلة أثناء المسح — اتأكد من النت وجرّب تاني"); }
  });
}

/* ======================================================================
   🔓 إعادة فتح قافلة مقفولة للتعديل — لمدير النظام بس
   بيرجّع حالات القافلة (من النسخة المحفوظة وقت الإنهاء) للتسجيل والأرشيف
   والصيدلية والنظارات، وتفضل القافلة شغالة لحد ما تقفلها تاني من "نظرة عامة".
   التقفيل التاني بيحدّث نفس القافلة (نفس الرقم والتسويات) مش بيعمل قافلة جديدة.
   ====================================================================== */
async function reopenConvoy(id){
  if(currentConvoy) return { ok:false, reason:"فيه قافلة شغالة دلوقتي — اقفلها أو الغيها الأول" };
  const [rec, cases, msgs] = await Promise.all([ getJSON("convoy:"+id, null), getJSON("convoyCases:"+id, null), getJSON("convoyMsgs:"+id, {}) ]);
  if(!rec) return { ok:false, reason:"تعذّر العثور على بيانات القافلة" };
  if(!Array.isArray(cases)) return { ok:false, reason:"القافلة دي اتقفلت قبل تحديث النظام، فحالاتها التفصيلية مش محفوظة ومينفعش تتفتح تاني" };
  // نرجّع الحالات وعلاماتها
  const jobs = [];
  for(const c of cases){
    jobs.push(()=>setCase(c.code, c));
    if(c.archived) jobs.push(()=>setFlag("archived:", c.code, true));
    if(c.pharmacy && c.pharmacy.dispensed) jobs.push(()=>setFlag("dispensed:", c.code, true));
    if(c.glassesInfo && c.glassesInfo.delivered) jobs.push(()=>setFlag("glassesDelivered:", c.code, true));
  }
  Object.entries(msgs||{}).forEach(([code, m])=>jobs.push(()=>setJSON("msg:"+code, m)));
  for(let i=0;i<jobs.length;i+=8) await Promise.all(jobs.slice(i,i+8).map(f=>f()));
  medStock = Array.isArray(rec.medStock) ? rec.medStock : [];
  await saveMedStock();
  currentConvoy = { location: rec.location||"", startedAt: rec.startedAt || new Date().toISOString(), reopenedId: id, reopenedName: rec.name||"", reopenedAt: new Date().toISOString() };
  await setJSON(CURRENT_CONVOY_KEY, currentConvoy);
  // نشيلها من سجل القوافل السابقة لحد ما تتقفل تاني
  const idx = await loadConvoyIndex();
  await saveConvoyIndex(idx.filter(c=>c.id!==id));
  return { ok:true, count: cases.length };
}
/* ======================================================================
   الموجّه الرئيسي للتطبيق
   ====================================================================== */
let currentSection = "hub"; // hub | explain | convoy | ops | closing | followups | admin | prep | chief

function render(){
  const slot = document.getElementById("roleBadgeSlot");
  if(slot){
    slot.innerHTML = roleBadgeHtml();
    const lb = document.getElementById("logoutBtn");
    if(lb) lb.addEventListener("click", ()=>{ clearSession(); clearVolSession(); setChiefUnlocked(false); currentSection="hub"; render(); });
  }
  const main = document.getElementById("main");
  const homeBtn = document.getElementById("homeBtn");
  // المتطوع: صفحات القافلة المسموحة بس — من غير رئيسية ولا أي قسم تاني
  if(isVolunteer()){ if(homeBtn) homeBtn.style.display = "none"; renderVolunteerShell(main); return; }
  if(homeBtn) homeBtn.style.display = getSession() ? "" : "none";
  // أي حد مش داخل: صفحة دخول (متطوع / فريق المؤسسة)
  if(!getSession()){ renderEntryGate(main); return; }
  if(currentSection==="explain") guardPage(main, "explain", "شرح طريقة العمل", renderExplain);
  else if(currentSection==="convoy") renderConvoySection(main);
  else if(currentSection==="ops") guardPage(main, "ops", "نظام إدارة العمليات", renderOpsSection);
  else if(currentSection==="closing") renderClosingSection(main);
  else if(currentSection==="followups") guardPage(main, "followups", "نظام المتابعات", renderFollowupsSection);
  else if(currentSection==="admin") renderAdminSection(main);
  else if(currentSection==="prep") guardPage(main, "prep", "نظام تجهيزات القافلة", renderPrepSection);
  else if(currentSection==="chief") renderChiefSection(main);
  else guardPage(main, "hub", "الصفحة الرئيسية", renderHub);
}

async function init(){
  if(getAppsScriptUrl() && isVolunteer()) await verifyVolunteerSession();
  if(getAppsScriptUrl()){
    await checkStorageAvailability();
    await loadMedTypes();
    await loadMedStock();
    await loadCurrentConvoy();
    await loadDeptPasswords();
    await loadPageLocks();
    await loadPrepChecklists();
  }
  render();
}
init();
