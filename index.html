function renderPrepList(main, kind){
  const isVillage = kind==="village";
  const list = isVillage ? prepVillage : prepSupplies;
  const saveFn = isVillage ? savePrepVillage : savePrepSupplies;
  const title = isVillage ? "تجهيزات القرية" : "المستلزمات التي تُؤخذ مع القافلة";

  main.innerHTML = `
    <div class="card">
      <h2>${title}</h2>
      <div class="row2" style="align-items:flex-end;">
        <div class="field" style="margin-bottom:0;">
          <label>إضافة بند جديد</label>
          <input type="text" id="newItemInput" placeholder="اسم البند">
        </div>
        <button class="btn btn-accent" id="addItemBtn" style="height:44px;">إضافة</button>
      </div>
    </div>
    <div class="card">
      <div id="itemsTable"></div>
      <div class="divider"></div>
      <button class="btn btn-danger-outline" id="archivePrepBtn">أرشفة هذه القائمة وبدء تجهيز جديد فارغ</button>
    </div>
  `;
  renderTable();

  document.getElementById("addItemBtn").addEventListener("click", async ()=>{
    const input = document.getElementById("newItemInput");
    const label = input.value.trim();
    if(!label) return;
    list.push({ id:uid(), label, qty:"", done:false });
    await saveFn();
    input.value = "";
    renderTable();
  });

  document.getElementById("archivePrepBtn").addEventListener("click", async ()=>{
    if(!confirm("هل أنت متأكد من أرشفة هذه القائمة وبدء قائمة جديدة فارغة؟")) return;
    const hist = await getJSON(PREP_HISTORY_KEY, []);
    hist.push({ id:uid(), kind, title, items:list, archivedAt:new Date().toISOString() });
    await setJSON(PREP_HISTORY_KEY, hist);
    if(isVillage){ prepVillage = DEFAULT_VILLAGE_ITEMS.map(l=>({id:uid(), label:l, qty:"", done:false})); await savePrepVillage(); }
    else{ prepSupplies = []; await savePrepSupplies(); }
    render();
  });

  function renderTable(){
    const box = document.getElementById("itemsTable");
    if(list.length===0){ box.innerHTML = `<p class="sub" style="margin:0;">لا توجد بنود بعد — أضِف من الأعلى</p>`; return; }
    box.innerHTML = `
      <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:14px;">
        <thead>
          <tr style="border-bottom:2px solid var(--border);text-align:right;">
            <th style="padding:8px 6px;">البند</th>
            <th style="padding:8px 6px;width:90px;">العدد</th>
            <th style="padding:8px 6px;width:60px;">تم</th>
            <th style="padding:8px 6px;width:40px;"></th>
          </tr>
        </thead>
        <tbody>
          ${list.map((it,i)=>`
            <tr style="border-bottom:1px solid var(--border);${it.done?'background:var(--success-bg);':''}">
              <td style="padding:7px 6px;">${escapeHtml(it.label)}</td>
              <td style="padding:7px 6px;"><input type="text" class="qtyInput" data-i="${i}" value="${escapeHtml(it.qty||"")}" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);"></td>
              <td style="padding:7px 6px;text-align:center;"><input type="checkbox" class="doneChk" data-i="${i}" ${it.done?"checked":""} style="width:19px;height:19px;accent-color:var(--primary);"></td>
              <td style="padding:7px 6px;"><button class="btn btn-danger-outline btn-sm delItemBtn" data-i="${i}" style="width:auto;padding:6px 9px;">✕</button></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
      </div>
    `;
    box.querySelectorAll(".qtyInput").forEach(inp=>{
      inp.addEventListener("change",(e)=>{ list[e.target.dataset.i].qty = e.target.value; saveFn(); });
    });
    box.querySelectorAll(".doneChk").forEach(chk=>{
      chk.addEventListener("change",(e)=>{ list[e.target.dataset.i].done = e.target.checked; saveFn(); renderTable(); });
    });
    box.querySelectorAll(".delItemBtn").forEach(btn=>{
      btn.addEventListener("click",(e)=>{
        list.splice(parseInt(e.target.dataset.i),1);
        saveFn();
        renderTable();
      });
    });
  }
}

function renderPrepHistory(main){
  main.innerHTML = `<div class="card"><p class="sub" style="margin:0;">جاري التحميل...</p></div>`;
  getJSON(PREP_HISTORY_KEY, []).then(hist=>{
    if(hist.length===0){ main.innerHTML = `<div class="card"><div class="empty"><div class="ic">🗂️</div>لا توجد تجهيزات مؤرشفة بعد</div></div>`; return; }
    main.innerHTML = hist.slice().reverse().map(h=>{
      const doneCount = h.items.filter(i=>i.done).length;
      return `
      <div class="card">
        <h2 style="font-size:15px;">${h.kind==="village"?"🏘️ تجهيزات القرية":"🎒 المستلزمات"}</h2>
        <p class="sub">اتؤرشفت في ${formatDateTime(h.archivedAt)}</p>
        <div class="stat-box" style="max-width:160px;"><div class="n">${doneCount}/${h.items.length}</div><div class="l">بند تم تجهيزه</div></div>
      </div>`;
    }).join("");
  });
}

   وتغيير باسورد أي صفحة من الصفحات المفتوحة، بالإضافة لسجل باسوردات/
   ملاحظات حرة لأي حاجة تانية عايز تحفظها. الصفحة دي نفسها محمية بباسورد
   "رئيس النظام" المستقل، وتقدر تغيّره من هنا برضو.

const CHIEF_PASS_KEY = "chiefPassword";
const CHIEF_UNLOCK_KEY = "shifa_chief_unlocked";
const CUSTOM_PASSWORDS_KEY = "customPasswords";

async function getChiefPassword(){ return await getJSON(CHIEF_PASS_KEY, "chief123"); }
function isChiefUnlocked(){ try{ return sessionStorage.getItem(CHIEF_UNLOCK_KEY)==="1"; }catch(e){ return false; } }
function setChiefUnlocked(v){
  try{ if(v) sessionStorage.setItem(CHIEF_UNLOCK_KEY,"1"); else sessionStorage.removeItem(CHIEF_UNLOCK_KEY); }catch(e){}
}

function renderChiefSection(main){
  if(!getAppsScriptUrl()){ renderSetupRequired(main); return; }
  if(isChiefUnlocked()){ renderChiefConsole(main); return; }
  main.innerHTML = `<div class="card"><p class="sub" style="margin:0;">جاري التحقق...</p></div>`;
  getChiefPassword().then(pass=>{
    main.innerHTML = `
      <button class="back-link" id="toHub">→ الرئيسية</button>

        <div class="card gate-card">
          <div class="ic">👑</div>

            <label>كلمة المرور</label>

          </div>
          <div id="chiefMsg"></div>
          <button class="btn btn-primary" id="chiefBtn">دخول</button>
        </div>
      </div>
    `;
    document.getElementById("toHub").addEventListener("click", ()=>{ currentSection="hub"; render(); });
    const doLogin = ()=>{
      const v = document.getElementById("chiefPass").value;
      if(v === pass){ setChiefUnlocked(true); render(); }
      else document.getElementById("chiefMsg").innerHTML = msgHtml("error","كلمة المرور غير صحيحة");
    };
    document.getElementById("chiefBtn").addEventListener("click", doLogin);

    const box = document.getElementById("deptPassRows");
    box.innerHTML = DEPTS.map(d=>`
      <div class="row2" style="align-items:flex-end;">
        <div class="field" style="margin-bottom:8px;">
          <label>${d.icon} ${escapeHtml(d.label)}</label>
          <input type="text" id="dp_${d.id}" value="${escapeHtml(deptPasswords[d.id]||"")}" dir="ltr" style="text-align:left;">
        </div>
      </div>
    `).join("");
  }

  function renderPageLockRows(){
    const box = document.getElementById("pageLockRows");
    box.innerHTML = LOCKABLE_PAGES.map(p=>{
      const cfg = pageLocks[p.id] || { enabled:false, password:"" };
      return `
      <div class="point-row" data-pid="${p.id}">
        <div class="pl" style="flex:1;">
          <label class="checkline" style="margin:0;">
            <input type="checkbox" class="lockEnableChk" data-pid="${p.id}" ${cfg.enabled?"checked":""}>
            <span>${escapeHtml(p.label)}</span>
          </label>
        </div>
        <input type="text" class="lockPassInput" data-pid="${p.id}" value="${escapeHtml(cfg.password||"")}" placeholder="كلمة مرور الصفحة" dir="ltr" style="text-align:left;max-width:160px;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);">
        <button class="btn btn-outline btn-sm saveLockBtn" data-pid="${p.id}" style="width:auto;">حفظ</button>
      </div>
    `;
    }).join("");
    box.querySelectorAll(".saveLockBtn").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        const pid = e.target.dataset.pid;
        const enabled = box.querySelector(`.lockEnableChk[data-pid="${pid}"]`).checked;
        const password = box.querySelector(`.lockPassInput[data-pid="${pid}"]`).value.trim();
        pageLocks[pid] = { enabled, password };
        await savePageLocks();
        alert("تم الحفظ ✓");
      });
    });
  }

  function renderCustomRows(list){
    const box = document.getElementById("customPassRows");
    if(!list || list.length===0){ box.innerHTML = `<p class="sub" style="margin:0;">لا توجد كلمات مرور إضافية مسجَّلة</p>`; return; }
    box.innerHTML = list.map(it=>`
      <div class="point-row" data-id="${it.id}">
        <div class="pl"><span>${escapeHtml(it.label)}</span></div>
        <span class="dept-tag" dir="ltr">${escapeHtml(it.value)}</span>
        <button class="btn btn-danger-outline btn-sm delCustomBtn" data-id="${it.id}" style="width:auto;">حذف</button>
      </div>
    `).join("");
    box.querySelectorAll(".delCustomBtn").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        const id = e.target.dataset.id;
        let l = await getJSON(CUSTOM_PASSWORDS_KEY, []);
        l = l.filter(x=>x.id!==id);
        await setJSON(CUSTOM_PASSWORDS_KEY, l);
        renderCustomRows(l);
      });
    });
  }
}

/* ======================================================================
   الإصدار 3 — Firebase بدل جوجل شيت
   - المتطوعين: كل متطوع بيدخل باسم مستخدم وكلمة مرور، ويشوف بس الصفحات
     اللي مدير النظام سمحله بيها (التسجيل / الأرشيف / الصيدلية / النظارات).
   - الرسائل: رسالة تسجيل + رسالة نتيجة الكشف لكل حالة على رقمها.
   - التقارير: كشوف وتقارير جاهزة للطباعة / PDF — للقافلة الحالية وللقوافل السابقة.
   - نقل البيانات القديمة من جوجل شيت لمرة واحدة.
   ====================================================================== */
const VOL_SESSION_KEY = "shifa_vol_session";
const VOLUNTEERS_KEY = "volunteers";
const VOL_PAGE_LABELS = { register:"📋 التسجيل", archive:"🗂️ الأرشيف", pharmacy:"💊 الصيدلية", glasses:"👓 النظارات" };

function getVolSession(){ try{ const r = localStorage.getItem(VOL_SESSION_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function setVolSession(o){ try{ localStorage.setItem(VOL_SESSION_KEY, JSON.stringify(o)); }catch(e){} }
function clearVolSession(){ try{ localStorage.removeItem(VOL_SESSION_KEY); }catch(e){} }
function isVolunteer(){ return !!getVolSession(); }
function volPages(){ const s = getVolSession(); return (s && s.vol && Array.isArray(s.vol.pages)) ? s.vol.pages : []; }
function actorName(){
  const v = getVolSession();
  if(v && v.vol) return v.vol.name + " (متطوع)";
  const s = getSession();
  return s ? deptLabel(s.role) : "";
}
async function loadVolunteers(){ const l = await getJSON(VOLUNTEERS_KEY, []); return Array.isArray(l) ? l : []; }
async function saveVolunteers(list){ return await setJSON(VOLUNTEERS_KEY, list); }
function newRev(){ return Math.random().toString(36).slice(2,10); }

/* أرقام عربي -> إنجليزي، وتنضيف رقم الموبايل */
function toLatinDigits(s){ return String(s||"").replace(/[٠-٩]/g, d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)); }
function cleanPhone(s){ return toLatinDigits(s).replace(/\D/g,""); }
function isValidEgMobile(p){ return /^01[0125]\d{8}$/.test(p); }
function intlPhone(p){ p = cleanPhone(p); return p.startsWith("0") ? "2" + p : p; }
function byCode(a,b){ return String(a.code||"").localeCompare(String(b.code||""), "en", { numeric:true }); }

      </div></div>`;
    document.getElementById("toSetup").addEventListener("click", ()=>renderSetupRequired(main));

/* نفس loadVolunteers بس بترمي خطأ لو مفيش نت (عشان منقولش "باسورد غلط" والمشكلة في النت) */
async function loadVolunteersStrict(){

  currentSection = "convoy";

async function verifyVolunteerSession(){
  const s = getVolSession();
  if(!s) return;
  let list;
  try{ list = await loadVolunteersStrict(); }catch(e){ return; } // مفيش نت — نسيبه يكمّل
  const v = list.find(x=>x.id===s.vol.id);
  if(!v || !v.active || v.rev!==s.rev || !v.pages || !v.pages.length){ clearVolSession(); return; }

}

/* ---------------- الرسائل للحالات ---------------- */
const SMS_TPL_KEY = "smsTemplates";
const DEFAULT_SMS_TEMPLATES = {
  reg:    "أهلاً {الاسم}، تم تسجيلك في قافلة شفاء الطبية بـ{المكان}. كود الكشف الخاص بك: {الكود}. مؤسسة غيث",
  action: "أهلاً {الاسم}، تم الكشف عليك في قافلة شفاء الطبية. نتيجة الكشف: {الإجراء}. سيتم التواصل معك على هذا الرقم لتحديد المواعيد. مؤسسة غيث",
  none:   "أهلاً {الاسم}، تم الكشف عليك في قافلة شفاء الطبية ولا تحتاج حالياً لأي إجراء إضافي. نتمنى لك دوام الصحة. مؤسسة غيث"
};
function caseActionText(c){
  const n = c.needs || {}, parts = [];
  if(n.surgery && n.surgery.needed){
    let t = "تحتاج إلى عملية " + (n.surgery.type||"");
    if(n.surgery.eye) t += " (" + (n.surgery.eye==="العينين" ? "العينين" : "العين ال" + (n.surgery.eye==="يمين"?"يمنى":"يسرى")) + ")";
    parts.push(t.replace(/\s+/g," ").trim());
  }
  if(n.glasses) parts.push("تحتاج إلى نظارة طبية");
  if(n.medications && n.medications.length) parts.push("صرف أدوية: " + n.medications.map(m=>m.type).join("، "));
  return parts.join("، و");
}
function caseResultKind(c){ return caseActionText(c) ? "action" : "none"; }
function buildCaseMessage(c, kind, tpls){
  const tpl = (tpls && tpls[kind]) || DEFAULT_SMS_TEMPLATES[kind] || "";
  return tpl.replace(/\{الاسم\}/g, (c.name||"").split(" ")[0])
            .replace(/\{الاسم_كامل\}/g, c.name||"")
            .replace(/\{الكود\}/g, c.code||"")
            .replace(/\{المكان\}/g, (currentConvoy && currentConvoy.location)||"")
            .replace(/\{الإجراء\}/g, caseActionText(c));
}
function isMsgPending(st){ return !st; }
async function loadMsgStatusMap(){
  const r = await httpStorage.listValues("msg:");
  const map = {};
  (r.items||[]).forEach(it=>{ try{ map[it.key.slice(4)] = JSON.parse(it.value); }catch(e){} });
  return map;
}
async function markMsg(code, kind, text){
  const cur = await getJSON("msg:"+code, {}) || {};
  cur[kind] = text;
  return await setJSON("msg:"+code, cur);
}

  cm.querySelectorAll("[data-mf]").forEach(b=>b.addEventListener("click", ()=>{ msgFilter = b.dataset.mf; renderMessages(cm); }));
  const openWa = (it)=>{
    const txt = buildCaseMessage(it.c, it.kind==="reg" ? "reg" : caseResultKind(it.c), tpls);
    window.open("https://wa.me/" + intlPhone(it.c.phone) + "?text=" + encodeURIComponent(txt), "_blank");
  };
  const stamp = (via)=> ("أُرسلت " + via + " " + new Date().toLocaleString("ar-EG",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})).replace(/\s+/g," ");

  cm.querySelectorAll(".mWa").forEach(b=>b.addEventListener("click", async ()=>{
    const it = shown[+b.dataset.i]; openWa(it);
    b.disabled = true; await markMsg(it.c.code, it.kind, stamp("واتساب")); renderMessages(cm);
  }));
  cm.querySelectorAll(".mSms").forEach(a=>a.addEventListener("click", async ()=>{
    const it = shown[+a.dataset.i]; await markMsg(it.c.code, it.kind, stamp("SMS")); setTimeout(()=>renderMessages(cm), 800);
  }));
  cm.querySelectorAll(".mDone").forEach(b=>b.addEventListener("click", async ()=>{
    const it = shown[+b.dataset.i]; b.disabled = true; await markMsg(it.c.code, it.kind, stamp("")); renderMessages(cm);
  }));
  const nextBtn = document.getElementById("waNextBtn");
  if(nextBtn) nextBtn.addEventListener("click", async ()=>{
    const it = shown.find(x=>isValidEgMobile(cleanPhone(x.c.phone)));
    if(!it){ alert("مفيش أرقام صحيحة متبقية"); return; }
    openWa(it); nextBtn.disabled = true; await markMsg(it.c.code, it.kind, stamp("واتساب")); renderMessages(cm);
  });

  document.getElementById("tplSave").addEventListener("click", async ()=>{
    const obj = { reg: document.getElementById("tpl_reg").value.trim(), action: document.getElementById("tpl_action").value.trim(), none: document.getElementById("tpl_none").value.trim() };
    const ok = await setJSON(SMS_TPL_KEY, obj);
    document.getElementById("tplMsg").innerHTML = ok ? msgHtml("success","تم حفظ نص الرسائل ✓") : msgHtml("error","حصل خطأ أثناء الحفظ");
    if(ok) setTimeout(()=>{ if(cm.isConnected) renderMessages(cm); }, 700);
  });
  document.getElementById("tplReset").addEventListener("click", ()=>{
    document.getElementById("tpl_reg").value = DEFAULT_SMS_TEMPLATES.reg;
    document.getElementById("tpl_action").value = DEFAULT_SMS_TEMPLATES.action;
    document.getElementById("tpl_none").value = DEFAULT_SMS_TEMPLATES.none;
  });
}

/* ======================================================================
   🖨️ التقارير — كشوف جاهزة للطباعة / PDF

const REPORT_TYPES = [
  { id:"summary",   ic:"📊", label:"ملخص القافلة",            desc:"الأعداد والاحتياجات وإنتاجية المتطوعين" },
  { id:"all",       ic:"📋", label:"كشف كل الحالات",          desc:"كل المسجلين واحتياج كل حالة",            landscape:true },
  { id:"ops",       ic:"🏥", label:"كشف حالات العمليات",       desc:"للمستشفى — الاسم والرقم القومي والتليفون ونوع التدخل", landscape:true },
  { id:"glasses",   ic:"👓", label:"كشف استلام النظارات",      desc:"بخانة توقيع للمستلم (للتسويات)",          landscape:true },
  { id:"meds",      ic:"💊", label:"كشف صرف الأدوية",          desc:"الأدوية لكل حالة بخانة توقيع (للتسويات)",  landscape:true },
  { id:"pending",   ic:"⏳", label:"حالات لم تُكشف بعد",        desc:"اتسجلت ولسه متأرشفتش" },
  { id:"messages",  ic:"📩", label:"متابعة الرسائل",           desc:"مين وصلته رسالة التسجيل والنتيجة" },
];
let reportState = { source:"current", type:"summary" };

/* بيانات قافلة: الحالية من الحالات الشغالة، أو سابقة من النسخة المحفوظة عند الإنهاء */
async function loadReportData(source){
  if(source==="current"){
    const [cases, msgs] = await Promise.all([ fetchAllCases(), loadMsgStatusMap() ]);
    return { cases, msgs, location: currentConvoy ? currentConvoy.location : "", name:"القافلة الحالية", date: currentConvoy ? currentConvoy.startedAt : null };
  }
  const [rec, cases, msgs] = await Promise.all([ getJSON("convoy:"+source, null), getJSON("convoyCases:"+source, null), getJSON("convoyMsgs:"+source, {}) ]);
  return { cases: Array.isArray(cases) ? cases : null, msgs: msgs||{}, location: rec ? rec.location : "", name: rec ? rec.name : "", date: rec ? (rec.startedAt||rec.endedAt) : null, stats: rec ? rec.stats : null };
}

function rptTable(headers, rows, opts){
  opts = opts || {};
  return `
    <table class="rpt-table">
      <thead><tr>${headers.map(h=>`<th${h.w?` style="width:${h.w}"`:""}>${escapeHtml(h.t||h)}</th>`).join("")}</tr></thead>
      <tbody>${rows.length ? rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${headers.length}" style="text-align:center;padding:14px;">لا توجد حالات</td></tr>`}</tbody>
    </table>`;
}
function needsSummary(c){
  const n = c.needs || {}, p = [];
  if(n.surgery && n.surgery.needed) p.push("عملية " + (n.surgery.type||"") + (n.surgery.eye ? " — " + n.surgery.eye : ""));
  if(n.glasses) p.push("نظارة");
  if(n.medications && n.medications.length) p.push("أدوية");
  return c.archived ? (p.join(" + ") || "لا يحتاج إجراء") : "لم يُكشف بعد";
}
const e_ = s => escapeHtml(s==null?"":s);
const blank = `<span class="rpt-blank"></span>`;

function buildReportBody(type, d){
  const cases = (d.cases||[]).slice().sort(byCode);
  const n = i => i+1;
  if(type==="summary"){
    const s = aggregateReport(cases);
    const archived = cases.filter(c=>c.archived).length;
    const glassesDelivered = cases.filter(c=>c.needs && c.needs.glasses && c.glassesInfo && c.glassesInfo.delivered).length;
    const vols = {};
    cases.forEach(c=>{
      if(c.registeredBy){ vols[c.registeredBy] = vols[c.registeredBy] || {reg:0,arc:0}; vols[c.registeredBy].reg++; }
      if(c.archivedBy){ vols[c.archivedBy] = vols[c.archivedBy] || {reg:0,arc:0}; vols[c.archivedBy].arc++; }
    });
    const box = (num, l)=>`<div class="rpt-stat"><div class="n">${num}</div><div class="l">${l}</div></div>`;
    return `
      <div class="rpt-stats">
        ${box(s.total,"إجمالي المسجلين")}${box(archived,"تم الكشف عليهم")}${box(s.total-archived,"لم يُكشف بعد")}
        ${box(s.surgeryCount,"يحتاجون عملية")}${box(s.glassesCount,"يحتاجون نظارة")}${box(s.medsNeededCases,"يحتاجون أدوية")}
        ${box(s.medsDispensedCases,"استلموا أدوية")}${box(glassesDelivered,"استلموا نظارة")}
      </div>
      <h3 class="rpt-h">العمليات حسب نوع التدخل</h3>
      ${rptTable(["نوع التدخل","عدد الحالات"], Object.entries(s.surgeryByType).map(([t,c])=>[e_(t), c]))}
      <h3 class="rpt-h">الأدوية</h3>
      ${rptTable(["الدواء","المطلوب (علبة)","المصروف (علبة)"], Array.from(new Set([...Object.keys(s.medsNeededByType),...Object.keys(s.medsDispensedByType)])).map(t=>[e_(t), s.medsNeededByType[t]||0, s.medsDispensedByType[t]||0]))}
      <h3 class="rpt-h">إنتاجية المتطوعين والإدارات</h3>
      ${rptTable(["الاسم","حالات سجّلها","حالات أرشفها"], Object.entries(vols).sort((a,b)=>(b[1].reg+b[1].arc)-(a[1].reg+a[1].arc)).map(([k,v])=>[e_(k), v.reg, v.arc]))}
    `;
  }
  if(type==="all"){
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","السن","الرقم القومي","الهاتف","الاحتياج","سجّلها"],
      cases.map((c,i)=>[n(i), e_(c.code), e_(c.name), e_(c.age), `<span dir="ltr">${e_(c.nationalId)}</span>`, `<span dir="ltr">${e_(c.phone)}</span>`, e_(needsSummary(c)), e_((c.registeredBy||"").replace(" (متطوع)",""))]));
  }
  if(type==="ops"){
    const list = cases.filter(c=>c.needs && c.needs.surgery && c.needs.surgery.needed);
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","السن","الرقم القومي","الهاتف","هاتف آخر","نوع التدخل","العين",{t:"ملاحظات",w:"130px"}],
      list.map((c,i)=>[n(i), e_(c.code), e_(c.name), e_(c.age), `<span dir="ltr">${e_(c.nationalId)}</span>`, `<span dir="ltr">${e_(c.phone)}</span>`, `<span dir="ltr">${e_(c.phone2)}</span>`, e_(c.needs.surgery.type), e_(c.needs.surgery.eye), blank]));
  }
  if(type==="glasses"){
    const list = cases.filter(c=>c.needs && c.needs.glasses);
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","الرقم القومي","الهاتف","تم التسليم",{t:"توقيع المستلم",w:"150px"}],
      list.map((c,i)=>[n(i), e_(c.code), e_(c.name), `<span dir="ltr">${e_(c.nationalId)}</span>`, `<span dir="ltr">${e_(c.phone)}</span>`, (c.glassesInfo && c.glassesInfo.delivered) ? "✓" : "", blank]));
  }
  if(type==="meds"){
    const list = cases.filter(c=>c.needs && c.needs.medications && c.needs.medications.length);
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","الرقم القومي","الأدوية","تم الصرف",{t:"توقيع المستلم",w:"150px"}],
      list.map((c,i)=>[n(i), e_(c.code), e_(c.name), `<span dir="ltr">${e_(c.nationalId)}</span>`, e_(c.needs.medications.map(m=>m.type+" ×"+(m.boxes||1)).join("، ")), (c.pharmacy && c.pharmacy.dispensed) ? "✓" : "", blank]));
  }
  if(type==="pending"){
    const list = cases.filter(c=>!c.archived);
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","السن","الهاتف","وقت التسجيل"],
      list.map((c,i)=>[n(i), e_(c.code), e_(c.name), e_(c.age), `<span dir="ltr">${e_(c.phone)}</span>`, e_(formatDateTime(c.registeredAt))]));
  }
  if(type==="messages"){
    const m = d.msgs || {};
    return rptTable([{t:"م",w:"34px"},"الكود","الاسم","الهاتف","رسالة التسجيل","رسالة النتيجة"],
      cases.map((c,i)=>{ const s = m[c.code]||{}; return [n(i), e_(c.code), e_(c.name), `<span dir="ltr">${e_(c.phone)}</span>`, e_(s.reg||"لم تُرسل"), c.archived ? e_(s.res||"لم تُرسل") : "—"]; }));
  }
  return "";
}

/* ---------------- تصدير Excel ---------------- */
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((res, rej)=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ()=>res(); s.onerror = ()=>rej(new Error("تعذّر تحميل مكتبة Excel — اتأكد من الإنترنت"));
    document.head.appendChild(s);
  });
}
async function exportCasesExcel(btn, cases, statusMap, location){
  const old = btn.textContent; btn.disabled = true; btn.textContent = "جاري التجهيز...";
  try{
    await loadSheetJS();
    statusMap = statusMap || {};
    const yn = b => b ? "نعم" : "لا";
    const rows = (cases||[]).slice().sort(byCode).map(c=>{
      const n = c.needs || {}, s = n.surgery || {}, st = statusMap[c.code] || {};
      return {
        "الكود": c.code, "الاسم": c.name||"", "الرقم القومي": c.nationalId||"", "السن": c.age||"",
        "رقم الهاتف": c.phone||"", "رقم هاتف آخر": c.phone2||"",
        "وقت التسجيل": formatDateTime(c.registeredAt), "سجّلها": c.registeredBy||"",
        "تمت الأرشفة": yn(c.archived), "أرشفها": c.archivedBy||"",
        "يحتاج عملية": yn(s.needed), "نوع التدخل": s.type||"", "العين": s.eye||"",
        "يحتاج نظارة": yn(n.glasses),
        "الأدوية": (n.medications||[]).map(m=>m.type+" ×"+(m.boxes||1)).join("، "),
        "صُرفت الأدوية": yn(c.pharmacy && c.pharmacy.dispensed),
        "استُلمت النظارة": yn(c.glassesInfo && c.glassesInfo.delivered),
        "رسالة التسجيل": st.reg||"", "رسالة النتيجة": st.res||""
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = Object.keys(rows[0]||{"":""}).map(k=>({ wch: Math.max(10, k.length+4) }));
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views:[{ RTL:true }] };
    XLSX.utils.book_append_sheet(wb, ws, "الحالات");
    const out = XLSX.write(wb, { bookType:"xlsx", type:"array" });
    const url = URL.createObjectURL(new Blob([out], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const a = document.createElement("a");
    a.href = url; a.download = `Shifa-cases-${new Date().toISOString().slice(0,10)}.xlsx`;   // اسم إنجليزي: بعض المتصفحات بتبوّظ الأسماء العربي
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ alert(e.message); }
  btn.disabled = false; btn.textContent = old;
}

/* ======================================================================
   نقل البيانات القديمة من جوجل شيت (مرة واحدة)
   ====================================================================== */
const OLD_SHEET_URL_KEY = "shifa_apps_script_url";   // الرابط القديم اللي كان محفوظ على الجهاز ده
async function oldSheetCall(url, payload){
  const res = await fetch(url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  if(j && j.error) throw new Error(j.error);
  return j;
}
function renderMigrationBlock(){
  let oldUrl = ""; try{ oldUrl = localStorage.getItem(OLD_SHEET_URL_KEY) || ""; }catch(e){}
  return `
    <div class="card">
      <h2>📦 نقل البيانات القديمة من جوجل شيت</h2>
      <p class="sub">بينسخ كل بيانات النظام القديمة (العمليات، المتابعات، القوافل السابقة، التسويات، الإعدادات وكلمات المرور) من جوجل شيت لقاعدة البيانات الجديدة. اعملها مرة واحدة بس. جوجل شيت نفسه مش بيتمسح منه حاجة.</p>
      <div class="field"><label>رابط Apps Script القديم</label>
        <input type="text" id="mig_url" value="${escapeHtml(oldUrl)}" placeholder="https://script.google.com/macros/s/..." dir="ltr" style="text-align:left;"></div>
      <label class="checkline"><input type="checkbox" id="mig_overwrite"><span>استبدل أي بيانات موجودة بنفس الاسم في القاعدة الجديدة</span></label>
      <div id="migMsg"></div>
      <button class="btn btn-primary" id="migBtn">بدء النقل</button>
    </div>`;
}
function wireMigrationBlock(){
  const btn = document.getElementById("migBtn");
  if(!btn) return;
  btn.addEventListener("click", async ()=>{
    const url = document.getElementById("mig_url").value.trim();
    const overwrite = document.getElementById("mig_overwrite").checked;
    const box = document.getElementById("migMsg");
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ box.innerHTML = msgHtml("error","حط رابط Apps Script القديم صح"); return; }
    btn.disabled = true;
    try{
      box.innerHTML = msgHtml("info","جاري قراءة قائمة البيانات من جوجل شيت...");
      const r = await oldSheetCall(url, { action:"list", prefix:"" });
      const keys = (r && r.keys) || [];
      const existing = overwrite ? new Set() : new Set((await httpStorage.list("")).keys || []);
      const todo = keys.filter(k=>!existing.has(k));
      let done = 0, failed = [];
      const worker = async ()=>{
        while(todo.length){
          const k = todo.shift();
          try{
            const v = await oldSheetCall(url, { action:"get", key:k });
            if(v && v.value!==undefined && v.value!==null) await httpStorage.set(k, String(v.value));
          }catch(e){ failed.push(k); }
          done++;
          box.innerHTML = msgHtml("info", `جاري النقل... ${done} من ${done + todo.length}`);
        }
      };
      await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
      const skipped = keys.length - done;
      box.innerHTML = failed.length
        ? msgHtml("error", `اتنقل ${done - failed.length} عنصر، وفشل ${failed.length} — دوس "بدء النقل" تاني يكمّل الناقص.`)
        : msgHtml("success", `✓ تم نقل ${done} عنصر${skipped ? ` (و${skipped} كانوا موجودين أصلاً)` : ""}. افتح الصفحة من جديد عشان تشوف البيانات.`);
    }catch(e){
      box.innerHTML = msgHtml("error","تعذّر الوصول لجوجل شيت القديم: " + e.message);
    }
    btn.disabled = false;
  });
}

/* ======================================================================
   🗑️ مسح قافلة — لمدير النظام بس
   - قافلة سابقة: بيمسح تقريرها وكشوفها ورسائلها وملف تسوياتها (والمرفقات)،
     واختياري حالات العمليات والمتابعات اللي اتنقلت منها.
   - القافلة الحالية: بيلغيها من غير ما يحفظ أي حاجة (مثلاً قافلة تجربة).
   ====================================================================== */
async function convoyLinkedCounts(id){
  const [ops, fus] = await Promise.all([ httpStorage.listValues("op:"), httpStorage.listValues("followup:") ]);
  const pick = r => (r.items||[]).filter(it=>{ try{ return JSON.parse(it.value).sourceConvoyId===id; }catch(e){ return false; } }).map(it=>it.key);
  return { opKeys: pick(ops), fuKeys: pick(fus) };
}
async function deleteEndedConvoy(id, withLinked){
  // 1) من سجل القوافل
  const idx = await loadConvoyIndex();
  await saveConvoyIndex(idx.filter(c=>c.id!==id));
  // 2) ملف التسويات + مرفقاته
  const st = await getJSON("settlement:"+id, null);
  if(st && Array.isArray(st.attachments)){
    for(const a of st.attachments){
      for(let i=0;i<(a.parts||0);i++){ try{ await httpStorage.delete(`file:${a.id}:${i}`); }catch(e){} }
    }
  }
  try{
    const sidx = await getJSON(SETTLEMENT_INDEX_KEY, []);
    await setJSON(SETTLEMENT_INDEX_KEY, (sidx||[]).filter(x=>x.convoyId!==id));
  }catch(e){}
  // 3) بيانات القافلة نفسها
  await Promise.all(["convoy:","convoyCases:","convoyMsgs:","settlement:"].map(p=>httpStorage.delete(p+id).catch(()=>null)));
  // 4) اختياري: العمليات والمتابعات اللي جاية منها
  if(withLinked){
    const { opKeys, fuKeys } = await convoyLinkedCounts(id);
    await Promise.all([...opKeys, ...fuKeys].map(k=>httpStorage.delete(k).catch(()=>null)));
  }
  return true;
}
async function cancelCurrentConvoy(){
  for(const p of ["case:","archived:","dispensed:","glassesDelivered:","msg:"]) await deleteAllWithPrefix(p);
  try{ await httpStorage.delete(CURRENT_CONVOY_KEY); }catch(e){}
  medStock = [];
  await saveMedStock();
  currentConvoy = null;
  return true;
}

/* كارت المسح — بيطلب باسورد مدير النظام قبل أي مسح */
function deleteConvoyCardHtml(kind, extra){
  const isCur = kind==="current";
  return `
    <div class="card" style="border:1.5px solid #e3a5a5;">
      <h2 style="color:#a12a2a;">🗑️ ${isCur ? "إلغاء القافلة الحالية ومسح بياناتها" : "مسح القافلة دي نهائيًا"}</h2>
      <p class="sub">${isCur
        ? "بيمسح كل الحالات اللي اتسجلت في القافلة الشغالة دلوقتي (التسجيل والأرشيف والصيدلية والنظارات والرسائل) من غير ما يحفظ تقرير. استخدمه لقافلة تجربة أو قافلة اتبدأت بالغلط."
        : "بيمسح تقرير القافلة وكشوفها ورسائلها وملف تسوياتها ومرفقاته. <b>مفيش رجوع بعد المسح.</b>"}</p>
      ${extra||""}
      <div class="field"><label>للتأكيد اكتب باسورد مدير النظام</label>
        <input type="password" id="delConvoyPass" dir="ltr" style="text-align:left;"></div>
      <div id="delConvoyMsg"></div>
      <button class="btn btn-danger-outline" id="delConvoyBtn">${isCur ? "إلغاء القافلة ومسح بياناتها" : "مسح القافلة نهائيًا"}</button>
    </div>`;
}
function wireDeleteConvoy(onConfirm){
  const btn = document.getElementById("delConvoyBtn");
  if(!btn) return;
  btn.addEventListener("click", async ()=>{
    const box = document.getElementById("delConvoyMsg");
    const pass = document.getElementById("delConvoyPass").value;
    await loadDeptPasswords();
    if(!pass || pass !== (deptPasswords && deptPasswords.admin)){ box.innerHTML = msgHtml("error","باسورد مدير النظام غير صحيح"); return; }
    if(!confirm("متأكد؟ المسح ده مالوش رجوع.")) return;
    btn.disabled = true; btn.textContent = "جاري المسح...";
    try{ await onConfirm(); }
    catch(e){ btn.disabled = false; btn.textContent = "حاول تاني"; box.innerHTML = msgHtml("error","حصلت مشكلة أثناء المسح — اتأكد من النت وجرّب تاني"); }
  });
}

/* ======================================================================
   الموجّه الرئيسي للتطبيق
   ====================================================================== */
let currentSection = "hub"; // hub | explain | convoy | ops | closing | followups | admin | prep | chief

function render(){
  const slot = document.getElementById("roleBadgeSlot");
  if(slot){
    slot.innerHTML = roleBadgeHtml();
    const lb = document.getElementById("logoutBtn");
    if(lb) lb.addEventListener("click", ()=>{ clearSession(); clearVolSession(); setChiefUnlocked(false); currentSection="hub"; render(); });
  }
  const main = document.getElementById("main");
  const homeBtn = document.getElementById("homeBtn");
  // المتطوع: صفحات القافلة المسموحة بس — من غير رئيسية ولا أي قسم تاني
  if(isVolunteer()){ if(homeBtn) homeBtn.style.display = "none"; renderVolunteerShell(main); return; }
  if(homeBtn) homeBtn.style.display = getSession() ? "" : "none";
  // أي حد مش داخل: صفحة دخول (متطوع / فريق المؤسسة)
  if(!getSession()){ renderEntryGate(main); return; }
  if(currentSection==="explain") guardPage(main, "explain", "شرح طريقة العمل", renderExplain);
  else if(currentSection==="convoy") renderConvoySection(main);
  else if(currentSection==="ops") guardPage(main, "ops", "نظام إدارة العمليات", renderOpsSection);
  else if(currentSection==="closing") renderClosingSection(main);
  else if(currentSection==="followups") guardPage(main, "followups", "نظام المتابعات", renderFollowupsSection);
  else if(currentSection==="admin") renderAdminSection(main);
  else if(currentSection==="prep") guardPage(main, "prep", "نظام تجهيزات القافلة", renderPrepSection);
  else if(currentSection==="chief") renderChiefSection(main);
  else guardPage(main, "hub", "الصفحة الرئيسية", renderHub);
}

async function init(){
  if(getAppsScriptUrl() && isVolunteer()) await verifyVolunteerSession();
  if(getAppsScriptUrl()){
    await checkStorageAvailability();
    await loadMedTypes();
    await loadMedStock();
    await loadCurrentConvoy();
    await loadDeptPasswords();
    await loadPageLocks();
    await loadPrepChecklists();
  }
  render();
}
init();
